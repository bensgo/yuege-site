<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d16">
  <meta name="description" content="App directory listings and discovery platforms featuring LumoKeep for iPhone.">
  <link rel="canonical" href="https://yuege.online/lumokeep/listings/">
  <link rel="icon" type="image/svg+xml" href="/lumokeep/assets/app-icon.svg">
  <title>App Listings | LumoKeep</title>
  <style>
    :root { color-scheme:dark; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(155deg,#10251f 0%,#080d16 45%,#050910 100%); color:#eef4f2; line-height:1.6; }
    a { color:inherit; }
    .wrap { width:min(100% - 40px,800px); margin:0 auto; }
    header { border-bottom:1px solid rgba(255,255,255,.1); }
    .brand { display:inline-flex;align-items:center;gap:11px;padding:20px 0;text-decoration:none;font-weight:750;font-size:17px; }
    .brand img { display:block;width:36px;height:36px;border-radius:9px; }
    main { padding:clamp(52px,10vh,100px) 0 80px; }
    .eyebrow { color:#87d5b8;letter-spacing:.11em;text-transform:uppercase;font-size:12px;font-weight:750; }
    h1 { font-size:clamp(34px,6vw,52px);line-height:1.14;letter-spacing:-.035em;margin:12px 0 16px; }
    .lead { color:#aab9b4; margin:0 0 36px;max-width:580px;font-size:16px; }
    .directory { border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:26px;background:rgba(255,255,255,.035); }
    .directory h2 { font-size:19px;letter-spacing:-.015em;margin:0 0 5px; }
    .directory p { color:#aab9b4;font-size:14px;margin:0 0 22px; }
    .badge { display:inline-flex;max-width:100%;border-radius:11px;outline-offset:5px; }
    .badge img { display:block; height:40px;width:auto;max-width:100%; }
    .back { display:inline-block;text-decoration:none;color:#87d5b8;font-size:14px;margin-top:28px; }
    .back:hover { text-decoration:underline; }
    footer { color:#879992;font-size:12px;border-top:1px solid rgba(255,255,255,.09);padding:22px 0 40px; }
    @media (max-width:600px) { .wrap { width:min(100% - 28px,800px); } .directory { padding:20px; } }
  </style>
</head>
<body>
  <header><div class="wrap">
    <a class="brand" href="/lumokeep/"><img src="/lumokeep/assets/app-icon.svg" alt="" width="36" height="36">LumoKeep</a>
  </div></header>
  <main class="wrap">
    <div class="eyebrow">LumoKeep / Directory</div>
    <h1>App listings</h1>
    <p class="lead">Find LumoKeep on independent app discovery and listing platforms.</p>
    <section class="directory" aria-labelledby="swb-title">
      <h2 id="swb-title">Sell With Boost</h2>
      <p>App discovery directory</p>
      <a class="badge" href="https://sellwithboost.com" target="_blank" rel="noopener noreferrer" aria-label="Visit Sell With Boost">
        <img src="https://sellwithboost.com/badge/listing.svg" alt="Listed on Sell With Boost" style="height:40px;width:auto">
      </a>
    </section>
    <a class="back" href="/lumokeep/">← Back to LumoKeep</a>
  </main>
  <footer><div class="wrap">© 2026 LumoKeep · Yuege Apps</div></footer>
</body>
</html>
